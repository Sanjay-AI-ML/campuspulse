<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusPulse — Smart Campus & Exam Issue Tracker</title>
  <meta name="description" content="Report, track, and resolve campus and exam issues. Built for Indian college students." />

  <!-- Tailwind (local vendor copy of play CDN, themed via tailwind.config below) -->
  <script src="vendor/tailwind.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // Dark navy surface system
            navy: {
              950: '#0b1222',  // page background
              900: '#131c31',  // primary surface  (brand color from brief)
              850: '#172139',
              800: '#1d2a47',  // card / elevated surface
              700: '#273352',  // borders, hover
              600: '#344066',
            },
            // Mint green accent (brand color from brief)
            mint:  { DEFAULT: '#3ddc97', dark: '#2bbd80', soft: '#3ddc9722' },
            amber: { DEFAULT: '#f5b544', soft: '#f5b54422' },
            danger:{ DEFAULT: '#f06a6a', soft: '#f06a6a22' },
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          boxShadow: {
            card: '0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5)',
            glow: '0 0 0 1px rgba(61,220,151,.35), 0 8px 30px -8px rgba(61,220,151,.25)',
          },
        },
      },
    };
  </script>

  <!-- Inter font (system fallback if CDN unavailable) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" onerror="this.remove()" />

  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="bg-navy-950 text-slate-200 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <!-- React + Babel standalone (local vendor copies — no CDN needed) -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>

  <!-- App scripts (order matters: deps -> icons -> api -> components -> app) -->
  <script type="text/babel" src="js/icons.js"></script>
  <script type="text/babel" src="js/api.js"></script>
  <script type="text/babel" src="js/components.js"></script>
  <script type="text/babel" src="js/dashboard.js"></script>
  <script type="text/babel" src="js/app.js"></script>
</body>
</html>
