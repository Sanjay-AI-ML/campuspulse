<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusPulse — Campus Issue Tracker</title>
  <meta name="description" content="Report, track and resolve campus issues. Built for college students." />

  <script src="vendor/tailwind.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg:     { DEFAULT: '#0d0f12', 1: '#131820', 2: '#181f2a', 3: '#1e2737' },
            border: { DEFAULT: 'rgba(255,255,255,0.07)', strong: 'rgba(255,255,255,0.12)' },
            mint:   { DEFAULT: '#3ddc97', dark: '#2bbd80', soft: 'rgba(61,220,151,0.12)', glow: 'rgba(61,220,151,0.20)' },
            amber:  { DEFAULT: '#f5b544', soft: 'rgba(245,181,68,0.12)' },
            danger: { DEFAULT: '#f06a6a', soft: 'rgba(240,106,106,0.12)' },
            violet: { DEFAULT: '#8b7cf8', soft: 'rgba(139,124,248,0.12)' },
            sky:    { 400: '#38bdf8' },
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
          },
          fontSize: {
            '2xs': ['0.65rem', { lineHeight: '1rem' }],
          },
          boxShadow: {
            card:  '0 1px 3px rgba(0,0,0,0.4), 0 8px 32px -8px rgba(0,0,0,0.5)',
            glow:  '0 0 0 1px rgba(61,220,151,0.3), 0 4px 16px rgba(61,220,151,0.15)',
            'violet-glow': '0 0 0 1px rgba(139,124,248,0.3)',
            input: 'inset 0 1px 2px rgba(0,0,0,0.3)',
          },
          letterSpacing: {
            tighter: '-0.04em',
            tight:   '-0.02em',
          },
        },
      },
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" onerror="this.remove()" />

  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="bg-bg text-slate-200 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>

  <script type="text/babel" src="js/icons.js"></script>
  <script type="text/babel" src="js/api.js"></script>
  <script type="text/babel" src="js/components.js"></script>
  <script type="text/babel" src="js/dashboard.js"></script>
  <script type="text/babel" src="js/app.js"></script>
</body>
</html>
